{% extends "base.html" %}
{% block content %}
<section class="container-fluid py-3">
  <h1>{% if form.instance.pk %}Edit{% else %}Add{% endif %} Account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'list_accounts' %}" class="btn btn-secondary">Cancel</a>
  </form>
</section>
{% endblock %}
