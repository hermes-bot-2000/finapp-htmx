{% extends "base.html" %}
{% block content %}
<section class="container-fluid py-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
    <h1 class="mb-0">Budgets</h1>
    <span class="text-nowrap">
      <a href="{% url 'create_budget' %}" class="btn btn-primary">Add Budget</a>
      <a href="{% url 'budget_summary' %}" class="btn btn-outline-secondary">View Summary</a>
    </span>
  </div>
  <ul class="list-group">
  {% for budget in budgets %}
    <li class="list-group-item d-flex justify-content-between align-items-center gap-2">
      <span>{{ budget.category.name }} - {{ budget.month|date:"Y-m" }}: ${{ budget.amount }}</span>
      <span class="text-nowrap">
        <a href="{% url 'update_budget' budget.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
        <a href="{% url 'delete_budget' budget.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
      </span>
    </li>
  {% empty %}
    <li class="list-group-item">No budgets yet.</li>
  {% endfor %}
  </ul>
</section>
{% endblock %}
