{% extends "base.html" %}
{% block content %}
<section class="container-fluid py-3">
  <h1>Delete Budget</h1>
  <p>Are you sure you want to delete <strong>{{ object.category.name }} — {{ object.month|date:'Y-m' }} (${{ object.amount }})</strong>?</p>
  <p class="text-muted">Transactions are not affected; only the budget target is removed.</p>
  <form method="post" action="{% url 'delete_budget' object.pk %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'list_budgets' %}" class="btn btn-secondary">Cancel</a>
  </form>
</section>
{% endblock %}
