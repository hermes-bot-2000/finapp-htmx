<nav>
  <a href="/" hx-get="{% url 'dashboard' %}" hx-target="#main-content" hx-push-url="true">Finapp</a>
  {% if user.is_authenticated %}
    <span>Hello, {{ user.username }}</span>
    <a href="{% url 'logout' %}" hx-post="{% url 'logout' %}" hx-target="body">Logout</a>
  {% else %}
    <a href="{% url 'login' %}" hx-get="{% url 'login' %}" hx-target="#main-content" hx-push-url="true">Login</a>
    <a href="{% url 'register' %}" hx-get="{% url 'register' %}" hx-target="#main-content" hx-push-url="true">Register</a>
  {% endif %}
</nav>
